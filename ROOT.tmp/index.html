<!DOCTYPE html>
<html>
<head>
    <title>ROOT.tmp – N6 Visualisierung</title>
    <style>
        body { background:#000; color:#0f0; font-family:monospace; padding:20px; }
        pre { background:#111; padding:12px; border:1px solid #333; }
        .n6 { margin-top:20px; padding:10px; border:1px solid #0f0; }
    </style>
</head>
<body>

<h1>N6 – Temporäre Symbiose Visualisierung</h1>
<pre id="output">Lade temporäre Werte…</pre>

<script type="module">
import { SYMBIOSE } from './symbiose.js';
import { N6_FLOW } from './n6.flow.js';
import { LR_AXIS } from './lr.axis.js';
import { WEG_LAUF } from './weg.lauf.js';
import { SLIDE } from './slide.js';
import { WETTE } from './wette.js';
import { VIS_EXPORT } from './vis.js';

// USER & USE laden
import user from './user.html';
import use from './use.html';

// Symbiose initialisieren
SYMBIOSE.init(user, use);

// L/R Achse
const lr = LR_AXIS(user.rawator, use.rolle);

// Weg/Lauf
const weg = WEG_LAUF(user.impuls, use.richtung);

// N6 Flow
const n6 = N6_FLOW(user, use, lr, weg);

// Ausgabe
document.getElementById("output").innerText =
`N6-Symbiose (temporär):
WARE: ${user.preis}
MARKT: ${use.volumen}
BALANCE (L/R): ${lr.balance}
WEG: ${weg}
SLIDE: ${n6.n5}
WETTE: ${n6.n6}
GPU-WERT: ${user.gpu}
INDUSTRY: ${use.industry}
`;

// Export an ROOT/index.html
window.N6_EXPORT = VIS_EXPORT(n6);
</script>

</body>
</html>
