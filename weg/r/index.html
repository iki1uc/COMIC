<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>WELT · PIPELINE2</title>
<style>
    body { background:#111; color:#eee; font-family:monospace; padding:20px; }
    button { margin:6px; padding:10px 14px; background:#222; color:#6cf; border:1px solid #6cf; }
    #out { white-space:pre; background:#000; padding:20px; margin-top:20px; border:1px solid #333; }
</style>
</head>

<body>

<h2>WELT · PIPELINE2 · Dashboard</h2>

<button onclick="qi_master()">QI · MASTER</button>
<button onclick="qi_respo()">QI · RESPO</button>
<button onclick="qi_p2()">QI · PIPELINE2</button>

<br><br>

<button onclick="p2_raw()">P0 · RAW → WAKE</button>
<button onclick="p2_structure()">P1 · STRUCTURE</button>
<button onclick="p2_vector()">P2 · VECTOR</button>

<pre id="out">ready…</pre>

<script type="module">

import { QI } from "./QI.js";
import { coreScan } from "./coreScan.js";

import { P0 } from "./pipelineP0.js";
import { P1 } from "./pipelineP1.js";
import { P2 } from "./pipelineP2.js";

window.out = function(msg){
    document.getElementById("out").innerText = msg;
};

/* ============================
   QI SCANS
   ============================ */

window.qi_master = function(){
    const core = coreScan();
    out("QI · MASTER\n" + JSON.stringify(QI.scan(core), null, 2));
};

window.qi_respo = function(){
    const core = coreScan();
    out("QI · RESPO\n" + JSON.stringify(QI.scan(core.respo360), null, 2));
};

window.qi_p2 = function(){
    const c0 = coreScan();
    const c1 = P0.run(c0);
    const c2 = P1.run(c1);
    const c3 = P2.run(c2);
    out("QI · PIPELINE2\n" + JSON.stringify(QI.scan(c3), null, 2));
};

/* ============================
   PIPELINE 0 → 1 → 2
   ============================ */

window.p2_raw = function(){
    const c0 = coreScan();
    const c1 = P0.run(c0);
    out("P0 · RAW → WAKE\n" + JSON.stringify(c1, null, 2));
};

window.p2_structure = function(){
    const c0 = coreScan();
    const c1 = P0.run(c0);
    const c2 = P1.run(c1);
    out("P1 · RAW → STRUCTURE\n" + JSON.stringify(c2, null, 2));
};

window.p2_vector = function(){
    const c0 = coreScan();
    const c1 = P0.run(c0);
    const c2 = P1.run(c1);
    const c3 = P2.run(c2);
    out("P2 · STRUCTURE → VECTOR\n" + JSON.stringify(c3, null, 2));
};

</script>

</body>
</html>
