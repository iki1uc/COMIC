<div class="box">
  <div class="title">WETTE · SLIDE · SCORER</div>

  <label style="color:#6cf;">Wert:</label>
  <input id="wetteSlide" type="range" min="0" max="100" value="50" 
         style="width:100%; margin:12px 0;">

  <pre id="wetteScore">Score: 50 · Zustand: MITTE</pre>
</div>

<script>
function scorerend(v){
    if(v < 20) return "LOW";
    if(v < 40) return "MID‑LOW";
    if(v < 60) return "MITTE";
    if(v < 80) return "HIGH";
    return "ULTRA";
}

document.getElementById("wetteSlide").addEventListener("input", e => {
    const v = Number(e.target.value);
    const s = scorerend(v);
    document.getElementById("wetteScore").textContent = 
        `Score: ${v} · Zustand: ${s}`;
});
</script>
